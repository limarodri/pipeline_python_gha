name: "Lab04 - Workflows Trigger Issue"

permissions:
  issues: write

on:
  issues:
    types: [opened, edited, closed, labeled]

jobs:
  issue-job:
    name: "Workflows Trigger Issue"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Informações da Issue
        run: |
          echo "Workflow diparado por Issue"
          echo "Ação:   ${{ github.event.action }}"
          echo "Issue:  ${{ github.event.issue.number }}"
          echo "Titulo: ${{ github.event.issue.title }}"
          echo "Autor:  ${{ github.event.issue.user }}"
          echo "Label:  ${{ github.event.issue.labels.*.name }}"

      - name: Resposta automática (nova issue)
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with: 
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Obrigado por reportar esta issue! Nossa equipe irá analisá-la em breve."
            })