## Isso é um WORKFLOW padrão de um git hub actions
## Um WORKFLOW nada mais e do que a automação em si que queremos
## performar quando temos uma nova feature
name: "Meu primeiro workflow"

## Aqui temos os eventos, que é o que trigga o workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

## Variaveis de ambiente
env:
  NODE_VERSION: '18'

## JOBS são conjuntos são um conjunto de tarefas que precisamos executar
jobs:
  demonstrando-estrutura: ## nome do nosso job
    name: "Demonstrar Estrutura Básica" ## como ele e exibido na interface
    runs-on: ubuntu-latest ## Ele é o RUNNER

    steps: ## Agora temos os STEPS que são um sequênciamento de ações
      - name: Checkout do Código
        uses: actions/checkout@v4 ## AÇÃO que é de fato o que se é executado uses sao ações do Marketplace

      - name: Mostrar estrutura .github/workflows
        run: | ## Esse é um exemplo de uma action personalizada que é feito 
          echo "== ESTRUTURA DE DIRETÓRIOS E ARQUIVOS .github/workflows =="
          ls -la .github/workflows
          echo ""
          echo "Total de workflows: $(ls -1 .github/workflows | wc -l)"

      - name: Elementos obrigatórios do workflow
        run: |
          echo "== ELEMENTOS OBRIGATÓRIOS =="
          echo "1. name: Nome do workflow"
          echo "2. on: Evento que dispara o workflow"
          echo "3. jobs: Definição dos trabalhos a serem executados"
          echo "4. runs-on: Ambiente onde o job será executado"
          echo "5. steps: Passos individuais dentro de um job"
          echo ""
          echo "Total de elementos obrigatórios: 5"

      - name: Variáveis e Contexto
        run: |
          echo "== VARIÁVEIS E CONTEXTO =="
          echo "Variável env: ${{ env.NODE_VERSION }}"
          echo "1. env: Definição de variáveis de ambiente"
          echo "2. contextos: Acesso a informações do workflow, job, runner, etc."
          echo ""
          echo "Total de variáveis de contexto: 2"